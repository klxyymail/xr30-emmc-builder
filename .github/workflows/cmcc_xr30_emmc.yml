name: Build ImmortalWrt · CMCC XR30 eMMC

# ============================================================================
#  CMCC XR30 eMMC（RAX3000Z 增强版 / 算力版）
#
#  源码 / 分支 / 机型 / feeds / 定制项 全部集中在本文件顶部 env 段。
#  日常改插件 → 改 configs/ 下的 .config（只用写 CONFIG_PACKAGE_xxx=y）
#  改源码/分支/feeds → 改下面 env 段
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '构建模式'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto        # 有 ImageBuilder 缓存就组装，否则完整编译
          - assemble    # 强制组装（没有 IB 则报错）
          - full        # 强制完整编译（重新生成 ImageBuilder）
      use_cache:
        description: '启用缓存加速'
        required: false
        default: true
        type: boolean

  # 定时：UTC 周二 02:00 = 北京时间 10:00，检测到上游更新才构建
  schedule:
    - cron: '0 2 * * 2'

permissions:
  contents: write

concurrency:
  group: build-xr30-emmc
  cancel-in-progress: false

env:
  # ==========================================================================
  #  源码（修改这里换源码 / 分支）
  # ==========================================================================
  REPO_URL:    'https://github.com/padavanonly/immortalwrt-mt798x-6.6'
  REPO_BRANCH: 'openwrt-24.10-6.6'

  # ==========================================================================
  #  机型（target/subtarget/device 三者决定编出什么固件）
  #  当前 6.6 内核分支没有 cmcc_xr30-emmc，用硬件相同的 RAX3000M eMMC 目标
  # ==========================================================================
  TARGET:    mediatek
  SUBTARGET: filogic
  DEVICE:    cmcc_rax3000m-emmc-mtk
  DEFCONFIG: mt7981-ax3000.config

  # ==========================================================================
  #  第三方插件仓库（追加到 feeds.conf.default 末尾，官方源优先级更高）
  #  格式: 名字 空格 地址;分支
  # ==========================================================================
  #
  #  ⚠ OAF（下面 oaf 那一行）：v1.7.1 起【默认不再选择任何 OAF 包】。
  #    上游存在 kconfig 递归依赖 bug：
  #      symbol PACKAGE_kmod-oaf is selected by PACKAGE_kmod-oaf
  #    导致 kmod-oaf 从头到尾没被编译，安装阶段依赖它的
  #    appfilter / luci-app-oaf 全部失败 →
  #    package/install Error 255 → 整个构建失败。
  #    feed 行保留在此，方便日后上游修复后重新启用；
  #    configs/ 里不选 OAF 包就不会参与编译，无副作用。
  #    详见 configs/cmcc_xr30_emmc.config 第十节。
  FEEDS: |
    helloworld https://github.com/fw876/helloworld.git;dev
    istore     https://github.com/linkease/istore.git;main
    lucky      https://github.com/gdy666/luci-app-lucky.git;main
    oaf        https://github.com/destan19/OpenAppFilter.git;master
  # ==========================================================================
  #  固件定制（改这里 = 改 IP / 主机名 / 主题）
  # ==========================================================================
  LAN_IP:   192.168.6.1
  HOSTNAME: ImmortalWrt
  TIMEZONE: CST-8
  ZONENAME: Asia/Shanghai
  THEME:    argon

  # ==========================================================================
  #  PassWall 出厂预置（PT / BT 下载安全）
  #
  #  目标：同一台电脑既能科学上网，又能跑 PT/BT，且下载流量不走代理。
  #
  #  原理：网页流量走 80/443，BT 的 P2P 走高端口（6881-6889、51413 等），
  #        两者端口区间天然分离，用端口过滤即可分开处理。
  #
  #  PW_TCP_REDIR_PORTS：TCP 只代理这些端口
  #    下列默认值即 PassWall 的「常用端口」，已含 80/443（网页）。
  #    BT 常用端口不在其中 → P2P 下载自动直连。
  #    80,443 = 仅网页（更保守）；1:65535 = 全代理（不要用）。
  #
  #  PW_UDP_PROXY：UDP 是否代理
  #    0（默认，PT 必须）→ udp_proxy_mode=disable，所有 UDP 直连。
  #      ⚠ PassWall 的 udp_redir_ports 默认是 1:65535（全代理），
  #        而 PT 的 DHT / UDP tracker 全是 UDP —— 不关掉就等于全走代理，
  #        前面的端口过滤全部白做。
  #    1 → 开启 UDP 代理（需要 UDP 转发或游戏加速时再开）。
  #
  #  PW_DIRECT_HOSTS：直连域名（空格分隔）
  #    ⚠ 这项【必须自己填你实际使用的 PT 站域名】。
  #      tracker 通信走 80/443，会被上面的「常用端口」规则代理掉，
  #      导致 PT 站记录到 VPS IP，判定「盒子下载」，失去限免与上传优惠。
  #      加入直连列表后 tracker 走家宽，站点记录真实 IP。
  #      例：m-team.cc hdsky.me ourbits.club
  #      留空则只写入注释，不添加任何域名。
  #
  #  ⚠ 本预置【不会】自动开启 PassWall 主开关（enabled 保持 0）：
  #     还没导入节点就启用会启动失败、刷错误日志。
  #     请刷机后导入节点，再手动打开主开关。
  #
  #  ⚠ 仅对【全新刷机 / 重置配置】生效。sysupgrade 保留配置时不会执行
  #     （uci-defaults 只在首次启动运行），不会覆盖你已有的设置。
  # ==========================================================================
  PW_TCP_REDIR_PORTS: '22,25,53,80,143,443,465,587,853,873,993,995,5222,8080,8443,9418'
  PW_UDP_PROXY: 0
  PW_DIRECT_HOSTS: ''

  # ==========================================================================
  #  硬件加速（HNAT / PPE）出厂默认开关
  #
  #  源码默认是【开启】的：defconfig 编译 kmod-mediatek_hnat，
  #  且 luci-app-turboacc-mtk 的 uci-defaults 在首次启动时写入
  #    fastpath=mediatek_hnat / fastpath_mh_eth_hnat=1 / v6=1
  #
  #  ⚠ 但硬件加速与下列功能【互斥】，开启时它们全部失效：
  #      · PassWall 透明代理（流量不过 CPU，无法重定向）
  #      · OAF 应用过滤（不经过 netfilter 钩子，识别不到应用）
  #
  #    ⚠ v1.5.0 曾彻底移除硬件加速，v1.6.0 已回退为「保留但默认关闭」。
  #      现在 turboacc 界面与内核模块都在（沿用 defconfig 的 =y），
  #      本开关决定【出厂默认值】，刷机后可在 LuCI 页面随时手动切换。
  #
  #    0 = 关闭硬件加速（默认，代理 PassWall 与 OAF 需要）
  #    1 = 开启硬件加速（跑满 NAT 性能，但代理与 OAF 会失效）
  #
  #  实现方式是改写 turboacc 的 uci-defaults 脚本本身
  #  （只改 /etc/config/turboacc 无效，uci-defaults 首次启动会覆盖它）。
  # ==========================================================================
  HW_OFFLOAD: 0

  # --------------------------------------------------------------------------
  CONFIG_DIR:  configs
  CONFIG_FILE: configs/cmcc_xr30_emmc.config
  STATE_FILE:  .upstream-commit-cmcc_xr30_emmc
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: '1'
  TZ: Asia/Shanghai

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.changed }}
      head_sha:     ${{ steps.fetch.outputs.sha }}
      head_short:   ${{ steps.fetch.outputs.short }}
      head_msg:     ${{ steps.fetch.outputs.msg }}
      head_date:    ${{ steps.fetch.outputs.date }}
      reason:       ${{ steps.decide.outputs.reason }}
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v5

      - name: 获取上游最新提交
        id: fetch
        run: |
          SHA=$(git ls-remote "${{ env.REPO_URL }}" \
                  "refs/heads/${{ env.REPO_BRANCH }}" | awk '{print $1}')
          if [ -z "$SHA" ]; then
            echo "::error::无法获取 ${{ env.REPO_BRANCH }} 的提交号"
            exit 1
          fi
          echo "上游 HEAD: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

          REPO_PATH=$(echo "${{ env.REPO_URL }}" | sed -E 's#https://github.com/##; s#\.git$##')
          JSON=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/$REPO_PATH/commits/$SHA" || true)
          MSG=$(echo "$JSON" | jq -r '.commit.message // ""' 2>/dev/null \
                | head -n1 | cut -c1-200 | tr -d '`${}' || true)
          DATE=$(echo "$JSON" | jq -r '.commit.author.date // ""' 2>/dev/null || true)
          echo "msg=${MSG:-（未获取到提交信息）}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE:-未知}" >> "$GITHUB_OUTPUT"

      - name: 决定是否构建
        id: decide
        uses: actions/github-script@v8
        with:
          script: |
            const sha = '${{ steps.fetch.outputs.sha }}';
            const branch = '${{ env.REPO_BRANCH }}';
            const stateFile = '${{ env.STATE_FILE }}';
            let prev = '';
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: stateFile,
                ref: context.payload.repository.default_branch
              });
              prev = Buffer.from(data.content, 'base64').toString('utf8').trim();
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const changed = prev !== sha;
            let shouldBuild, reason;
            if (context.eventName === 'workflow_dispatch') {
              shouldBuild = true;
              reason = '手动触发';
            } else if (changed) {
              shouldBuild = true;
              reason = '上游有更新';
            } else {
              shouldBuild = false;
              reason = '上游无更新，跳过';
            }
            core.setOutput('changed', String(shouldBuild));
            core.setOutput('reason', reason);
            await core.summary.addRaw([
              '## 构建决策', '',
              '| 项目 | 值 |', '| --- | --- |',
              `| 源码 | \`${{ env.REPO_URL }}\` |`,
              `| 分支 | \`${{ env.REPO_BRANCH }}\` |`,
              `| 设备 | \`${{ env.DEVICE }}\` |`,
              `| 已构建 | \`${(prev || '无').slice(0, 7)}\` |`,
              `| 上游 | \`${sha.slice(0, 7)}\` |`,
              `| 更新 | ${changed ? '是' : '否'} |`,
              `| 动作 | ${shouldBuild ? '**构建**' : '跳过'} |`,
            ].join('\n')).write();

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      USE_CACHE: ${{ github.event_name == 'schedule' || inputs.use_cache }}

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v5

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: 环境信息
        run: |
          echo "CPU: $(nproc)"; free -h; df -hT /

      - name: 安装编译依赖
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo apt-get clean

      - name: 拉取源码
        run: |
          git clone --depth 1 --single-branch -b "${{ env.REPO_BRANCH }}" "${{ env.REPO_URL }}" openwrt
          cd openwrt
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          KV=$(grep -m1 -E '^LINUX_VERSION-6\.6 ' include/kernel-* 2>/dev/null \
               | head -1 | awk '{print $3}')
          echo "KERNEL=${KV:-6.6}" >> "$GITHUB_ENV"

      - name: 计算配置指纹（用于缓存 key）
        run: echo "CFG_HASH=$(md5sum "${{ env.CONFIG_FILE }}" | cut -d' ' -f1 | cut -c1-12)" >> "$GITHUB_ENV"

      # ======================== ImageBuilder 缓存 ========================
      - name: 恢复 ImageBuilder
        id: try_ib
        if: ${{ inputs.mode != 'full' }}
        uses: actions/cache/restore@v4
        with:
          path: ibcache
          key: ib-${{ env.DEVICE }}-${{ env.REPO_BRANCH }}-${{ env.KERNEL }}

      - name: 解压 IB 并检测包完整性
        if: ${{ inputs.mode != 'full' }}
        run: |
          IB=$(ls ibcache/*imagebuilder*.tar.zst 2>/dev/null | head -1)
          if [ -z "$IB" ]; then
            echo "IB_HIT=0" >> "$GITHUB_ENV"
            echo "未命中 ImageBuilder 缓存"
            exit 0
          fi
          echo "IB_HIT=1" >> "$GITHUB_ENV"
          command -v zstd >/dev/null || sudo apt-get install -y -qq zstd
          mkdir -p "$GITHUB_WORKSPACE/ib"
          tar -I zstd -xf "$GITHUB_WORKSPACE/$IB" -C "$GITHUB_WORKSPACE/ib" --strip-components=1
          echo "内嵌包数量: $(ls "$GITHUB_WORKSPACE/ib"/packages/*.ipk 2>/dev/null | wc -l)"

          PKGS=$(grep -oE '^CONFIG_PACKAGE_[A-Za-z0-9_.-]+=y' \
                   "$GITHUB_WORKSPACE/${{ env.CONFIG_FILE }}" \
                 | sed 's/^CONFIG_PACKAGE_//; s/=y$//' \
                 | grep -vE '_INCLUDE_|_EXCLUDE_' | sort -u)

          pkg_exists() {
            local n="$1" alt="${1//_/-}"
            ls "$GITHUB_WORKSPACE/ib"/packages/"${n}_"*.ipk >/dev/null 2>&1 && return 0
            [ "$n" != "$alt" ] && ls "$GITHUB_WORKSPACE/ib"/packages/"${alt}_"*.ipk >/dev/null 2>&1 && return 0
            return 1
          }
          is_option_of_existing_pkg() {
            local cur="$1"
            while [ "$cur" != "${cur%_*}" ]; do
              cur="${cur%_*}"; [ -z "$cur" ] && break
              pkg_exists "$cur" && return 0
            done
            return 1
          }

          AVAIL=""; MISSING=""
          for p in $PKGS; do
            if pkg_exists "$p"; then AVAIL="$AVAIL $p"
            elif is_option_of_existing_pkg "$p"; then continue
            else MISSING="$MISSING $p"; fi
          done
          echo "AVAIL_PKGS=$AVAIL" >> "$GITHUB_ENV"
          echo "MISSING_PKGS=$MISSING" >> "$GITHUB_ENV"
          echo "MISSING_COUNT=$(echo $MISSING | wc -w)" >> "$GITHUB_ENV"
          echo "候选 $(echo $PKGS | wc -w) → 可装 $(echo $AVAIL | wc -w) / 缺失 $(echo $MISSING | wc -w)"
          for p in $MISSING; do echo "  缺失: $p"; done

      - name: 决定构建路径
        run: |
          MODE="${{ inputs.mode }}"; [ -z "$MODE" ] && MODE="auto"
          echo "模式: $MODE | 内核: ${KERNEL} | IB: ${IB_HIT:-0} | 缺失: ${MISSING_COUNT:-0}"
          if [ "$MODE" = "full" ] || [ "${IB_HIT:-0}" != "1" ]; then
            echo "ASSEMBLE=0" >> "$GITHUB_ENV"
            echo "路径: 完整编译"
          elif [ "${MISSING_COUNT:-0}" != "0" ]; then
            echo "ASSEMBLE=0" >> "$GITHUB_ENV"
            echo "路径: 完整编译（${MISSING_COUNT} 个新包需编译进 IB）"
          else
            echo "ASSEMBLE=1" >> "$GITHUB_ENV"
            echo "路径: 组装（约 3-10 分钟）"
          fi

          # 记录构建起点，用于统计编译/组装耗时
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      # ========================== 三层缓存 ==========================
      - name: 恢复 dl 缓存
        if: ${{ env.USE_CACHE == 'true' && env.ASSEMBLE != '1' }}
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.DEVICE }}-${{ env.REPO_BRANCH }}-${{ env.CFG_HASH }}
          restore-keys: |
            dl-${{ env.DEVICE }}-${{ env.REPO_BRANCH }}-
            dl-${{ env.DEVICE }}-

      - name: 恢复 Go/host 缓存
        if: ${{ env.USE_CACHE == 'true' && env.ASSEMBLE != '1' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/build_dir/host
            openwrt/build_dir/hostpkg
            openwrt/tmp/go-build
            openwrt/tmp/go-mod-cache
          key: go-${{ env.DEVICE }}-${{ env.REPO_BRANCH }}-${{ env.CFG_HASH }}
          restore-keys: |
            go-${{ env.DEVICE }}-${{ env.REPO_BRANCH }}-
            go-${{ env.DEVICE }}-

      - name: 恢复 ccache
        if: ${{ env.USE_CACHE == 'true' && env.ASSEMBLE != '1' }}
        uses: actions/cache/restore@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.DEVICE }}-${{ env.REPO_BRANCH }}-${{ env.CFG_HASH }}
          restore-keys: |
            ccache-${{ env.DEVICE }}-${{ env.REPO_BRANCH }}-
            ccache-${{ env.DEVICE }}-

      - name: 配置 feeds
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          echo "${{ env.FEEDS }}" | grep -v '^$' | while IFS= read -r line; do
            NAME=$(echo "$line" | awk '{print $1}')
            URL=$(echo "$line"  | awk '{print $2}')
            [ -n "$NAME" ] && [ -n "$URL" ] && echo "src-git $NAME $URL" >> feeds.conf.default
          done
          echo "=== feeds ==="; cat feeds.conf.default

      - name: 更新并安装 feeds
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "=== 关键包校验 ==="
          # ⚠ 必须加 -L：feeds install 创建的是 symlink
          #   package/feeds/luci/luci-app-passwall -> ../../../feeds/luci/applications/luci-app-passwall
          #   不加 -L 时 find 默认不跟随 symlink，且 symlink 的 type 是 l 而非 d，
          #   会导致所有 feeds 包都被误报为 [缺失]（实测确认，与历史日志一致）
          for p in luci-app-passwall luci-theme-argon luci-app-argon-config \
                   luci-app-store luci-lib-taskd luci-lib-xterm taskd \
                   luci-app-ddns-go ddns-go \
                   luci-app-lucky lucky \
                   luci-app-watchcat watchcat \
                   luci-app-diskman; do
            if find -L package/feeds -maxdepth 3 -name "$p" -type d 2>/dev/null | grep -q .; then
              echo "  [OK]   $p"
            else
              echo "  [缺失] $p"
            fi
          done


            # ------------------------------------------------------------------
            # 移除 luci-app-ssr-plus 的包定义（v1.7.2）
            #
            #   背景：v1.6.0 起已不再编译 ssr-plus，但它的 Makefile 仍随
            #         helloworld feed 被 install 进来，config 项依然存在。
            #
            #   问题：该 Makefile 里有这段（helloworld@dev 实测）：
            #           config PACKAGE_luci-app-ssr-plus_INCLUDE_Mihomo
            #             bool "Include Mihomo (Clash Support)"
            #             select PACKAGE_mihomo
            #             select PACKAGE_v2ray-geoip
            #             depends on aarch64||arm||i386||loongarch64||riscv64||x86_64
            #             default y if aarch64||arm||i386||loongarch64||riscv64||x86_64
            #
            #         ⚠ depends on 只写了【架构】，没有 depends on ssr-plus 本身！
            #         于是即便不选 ssr-plus，只要目标是 aarch64（MT7981 正是），
            #         该开关就默认 =y，进而 select PACKAGE_mihomo。
            #
            #   后果：mihomo 是超重的 Go 项目（GO_PKG_TAGS:=with_gvisor，
            #         gvisor 体量巨大），被无端拉进编译，极易失败：
            #           ERROR: package/feeds/helloworld/mihomo failed to build.
            #         同时白白拖长编译时间。
            #
            #   同样问题：INCLUDE_Http_Proxy（select PACKAGE_3proxy，aarch64 默认 y）。
            #
            #   修复：直接删除该包目录，让这些 config 项根本不进入 kconfig。
            #         比在 .config 写 "is not set" 更彻底——kconfig 中
            #         select 优先级高于 is not set，写 is not set 未必生效。
            #
            #   注意：helloworld 的 xray-core / chinadns-ng / geoview 仍保留。
            # ------------------------------------------------------------------
            for d in feeds/helloworld/luci-app-ssr-plus \
                     package/feeds/helloworld/luci-app-ssr-plus; do
              if [ -e "$d" ] || [ -L "$d" ]; then
                rm -rf "$d"
                echo "  [已移除] $d（避免 mihomo 被无端拉入编译）"
              fi
            done
      - name: 载入机型配置
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          cp -f "defconfig/${{ env.DEFCONFIG }}" .config
          sed -i '/^CONFIG_TARGET_DEVICE_/d' .config
          sed -i 's/^CONFIG_TARGET_MULTI_PROFILE=y/# CONFIG_TARGET_MULTI_PROFILE is not set/' .config
          sed -i 's/^CONFIG_TARGET_PER_DEVICE_ROOTFS=y/# CONFIG_TARGET_PER_DEVICE_ROOTFS is not set/' .config
          sed -i "/^CONFIG_TARGET_${{ env.TARGET }}_[A-Za-z0-9_]*=y$/d" .config
          echo "CONFIG_IB=y" >> .config
          echo "CONFIG_IB_STANDALONE=y" >> .config
          cat >> .config <<EOF
          CONFIG_TARGET_${{ env.TARGET }}=y
          CONFIG_TARGET_${{ env.TARGET }}_${{ env.SUBTARGET }}=y
          CONFIG_TARGET_${{ env.TARGET }}_${{ env.SUBTARGET }}_DEVICE_${{ env.DEVICE }}=y
          EOF
          # 追加用户插件配置
          # ⚠ 必须同时匹配两类行，不能只取 ^CONFIG_：
          #   ^CONFIG_                        → CONFIG_PACKAGE_xxx=y     （开启）
          #   ^# CONFIG_xxx is not set        → 取消 defconfig 里的默认开启
          # 只取 ^CONFIG_ 会让所有 "is not set" 行被丢弃，
          # 导致无法取消 defconfig 中已 =y 的包（实测验证过）。
          # 不匹配 "# CONFIG_xxx=y" 这种被注释掉的可选项，避免误生效。
          grep -E '^CONFIG_|^# CONFIG_[A-Za-z0-9_-]+ is not set[[:space:]]*$' \
            "$GITHUB_WORKSPACE/${{ env.CONFIG_FILE }}" >> .config
          make defconfig
          echo "=== 机型 ==="
          grep -E "^CONFIG_TARGET_${{ env.TARGET }}|^CONFIG_TARGET_MULTI_PROFILE" .config
          echo "=== 关键插件 ==="
          for k in luci-app-passwall luci-app-store luci-app-diskman \
                   luci-app-ddns-go luci-theme-argon luci-app-lucky; do
            grep -m1 "^CONFIG_PACKAGE_${k}=" .config || echo "  $k 未启用"
          done

          echo "=== 最终进入固件的 LuCI 应用（决定菜单显示）==="
          grep -oE '^CONFIG_PACKAGE_luci-app-[A-Za-z0-9._+-]+=y$' .config \
            | sed 's/^CONFIG_PACKAGE_//; s/=y$//' | sort | sed 's/^/  /'
          echo "  --- OAF（v1.7.1 起已移除，应无输出）---"
          grep -E '^CONFIG_PACKAGE_(luci-app-oaf|appfilter|kmod-oaf)=' .config \
            | sed 's/^/  ! 仍启用: /' || true
          echo "  --- DNS（代理插件依赖 dnsmasq-full）---"
          grep -E '^CONFIG_PACKAGE_dnsmasq' .config | sed 's/^/  /'
          echo "  --- 硬件加速（保留，出厂默认关闭；缺失则需检查 defconfig）---"
          grep -E '^CONFIG_PACKAGE_(luci-app-turboacc-mtk|kmod-mediatek_hnat|kmod-warp)=' .config \
            | sed 's/^/  /' || echo "  (未在 .config 中找到，可能已被取消)"
          echo "  --- eMMC 自动挂载依赖 ---"
          grep -E '^CONFIG_PACKAGE_(kmod-fs-ext4|block-mount|blkid)=' .config \
            | sed 's/^/  /' || echo "  (缺失！自动挂载将不生效)"

      - name: 应用定制项
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          CFG_GEN="package/base-files/files/bin/config_generate"
          [ -f "$CFG_GEN" ] || { echo "跳过定制"; exit 0; }
          [ -n "${{ env.LAN_IP }}" ]    && sed -i "s/192\.168\.[0-9]\+\.1/${{ env.LAN_IP }}/g" "$CFG_GEN"
          [ -n "${{ env.HOSTNAME }}" ]  && sed -i "s/hostname='[A-Za-z0-9_-]*'/hostname='${{ env.HOSTNAME }}'/" "$CFG_GEN"
          [ -n "${{ env.TIMEZONE }}" ]  && sed -i "s/timezone='[A-Za-z0-9+-]*'/timezone='${{ env.TIMEZONE }}'/" "$CFG_GEN"
          [ -n "${{ env.ZONENAME }}" ]  && sed -i "s#zonename='[A-Za-z0-9/_-]*'#zonename='${{ env.ZONENAME }}'#" "$CFG_GEN"
          if [ -n "${{ env.THEME }}" ]; then
            LUCI_CFG=$(find feeds package -type f -path '*luci-base*' -name 'luci' \
                       -path '*etc/config*' 2>/dev/null | head -1)
            if [ -n "$LUCI_CFG" ]; then
              if grep -q 'mediaurlbase' "$LUCI_CFG"; then
                sed -i "s|option mediaurlbase .*|option mediaurlbase '/luci-static/${{ env.THEME }}'|" "$LUCI_CFG"
              else
                sed -i "/config core 'main'/a\\\toption mediaurlbase '/luci-static/${{ env.THEME }}'" "$LUCI_CFG"
              fi
            fi
          fi
          echo "=== 定制结果 ==="
          grep -E "lan) ipad|hostname=|timezone=|zonename=" "$CFG_GEN" 2>/dev/null | head -8

          # ------------------------------------------------------------------
          # 生成 PassWall 出厂预置脚本（PT/BT 安全）
          #
          #   ⚠ 必须在注入 files/ 【之前】生成，否则复制时会漏掉它。
          #   ⚠ 环境变量在这里（构建期）展开，写死进脚本；
          #      uci-defaults 是在路由器上跑的，那时拿不到 GitHub 的 env。
          #
          #   文件名 zzz- 前缀：确保在包自带的 uci-defaults（luci-passwall）之后执行。
          # ------------------------------------------------------------------
          PW_UD="$GITHUB_WORKSPACE/files/etc/uci-defaults"
          mkdir -p "$PW_UD"

          if [ "${{ env.PW_UDP_PROXY }}" = "1" ]; then
            PW_UDP_MODE=proxy
          else
            PW_UDP_MODE=disable
          fi

          {
            echo '#!/bin/sh'
            echo '# PassWall 出厂预置（由固件构建时生成，PT/BT 下载安全）'
            echo '# 仅首次启动执行；保留配置升级时不会运行，不会覆盖已有设置。'
            echo ''
            echo '# 未安装 passwall 则跳过'
            echo '[ -d /usr/share/passwall ] || exit 0'
            echo ''
            echo '# 确保 global section 存在（包不自带 /etc/config/passwall，'
            echo '#  conffiles 只是声明；首次启动时可能还没有这个 section）'
            echo 'uci -q get passwall.@global[0] >/dev/null 2>&1 || \'
            echo '  uci -q add passwall global >/dev/null 2>&1'
            echo 'uci -q get passwall.@global[0] >/dev/null 2>&1 || exit 0'
            echo ''
            echo "# TCP 仅代理常用端口（含 80/443 网页）"
            echo "uci -q set passwall.@global[0].tcp_redir_ports='${{ env.PW_TCP_REDIR_PORTS }}'"
            echo ''
            echo "# UDP 代理开关：${PW_UDP_MODE}"
            echo "uci -q set passwall.@global[0].udp_proxy_mode='${PW_UDP_MODE}'"
            echo ''
            echo '# 注意：不设置 enabled，保持关闭。'
            echo '# 未导入节点就启用会启动失败并刷错误日志，需用户手动开。'
            echo 'uci -q commit passwall'
            echo ''
            echo '# ---- 直连域名列表 ----'
            echo '# PassWall 的直连列表是【文件】而非 UCI：'
            echo '#   /usr/share/passwall/rules/direct_host'
            echo '# 每行一个域名，支持 # 注释与 geosite: 前缀。'
            echo 'mkdir -p /usr/share/passwall/rules'
            echo 'DIRECT_FILE=/usr/share/passwall/rules/direct_host'
            echo '[ -f "$DIRECT_FILE" ] || : > "$DIRECT_FILE"'
            echo ''
            echo '# 幂等：已写入过则跳过，避免重复追加'
            echo 'if ! grep -q "PT-DIRECT-PRESET" "$DIRECT_FILE" 2>/dev/null; then'
            echo '  {'
            echo '    echo ""'
            echo '    echo "# ===== PT-DIRECT-PRESET: PT/BT 站点直连（固件预置）====="'
            echo '    echo "# 目的：tracker 通信走 80/443 会被代理，导致站点记录 VPS IP"'
            echo '    echo "#       判定「盒子下载」，失去限免与上传优惠。"'
            echo '    echo "# 可在此处继续添加，或在 LuCI 规则列表里修改。"'
            for d in ${{ env.PW_DIRECT_HOSTS }}; do
              echo "    echo '${d}'"
            done
            echo '  } >> "$DIRECT_FILE"'
            echo '  logger -t passwall-preset "已写入直连域名列表"'
            echo 'fi'
            echo ''
            echo 'logger -t passwall-preset "出厂预置完成: TCP仅常用端口, UDP='${PW_UDP_MODE}'"'
            echo 'exit 0'
          } > "$PW_UD/zzz-passwall-preset"
          chmod +x "$PW_UD/zzz-passwall-preset"

          echo "=== PassWall 预置脚本已生成 ==="
          echo "  TCP 代理端口: ${{ env.PW_TCP_REDIR_PORTS }}"
          echo "  UDP 代理:     ${PW_UDP_MODE}"
          echo "  直连域名:     ${{ env.PW_DIRECT_HOSTS }}（空则仅写注释）"

          # ------------------------------------------------------------------
          # 注入 files/ 目录内容到固件（OpenWrt 标准机制）
          #   源码树顶层的 files/ 会被原样打包进 rootfs。
          #   包含：etc/uci-defaults/zzz-emmc-mount（eMMC 剩余空间自动挂载）
          #        etc/uci-defaults/zzz-passwall-preset（上面刚生成的）
          # ------------------------------------------------------------------
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            mkdir -p files
            cp -r "$GITHUB_WORKSPACE/files"/. files/
            echo "=== 已注入 files/ 内容 ==="
            find files -type f | sed 's/^/  /'
          else
            echo "（无 files/ 目录，跳过注入）"
          fi

      # ------------------------------------------------------------------
      # 硬件加速（HNAT / PPE）出厂默认值
      #
      # 改的是 turboacc 的 uci-defaults 脚本本身，而不是 /etc/config/turboacc：
      # uci-defaults 在首次启动时会【覆盖】config 文件里的值，
      # 只改 config 文件等于白改。
      #
      # 三个键的含义：
      #   fastpath                none → init.d 检测后会写 0 到
      #                           /sys/kernel/debug/hnat/hook_toggle 关闭 HNAT
      #   fastpath_mh_eth_hnat    0    → 有线 HNAT 卸载关闭
      #   fastpath_mh_eth_hnat_v6 0    → IPv6 HNAT 卸载关闭
      #
      # 幂等：sed 用精确键值匹配，重复执行结果一致。
      # ------------------------------------------------------------------
      - name: 设置硬件加速默认值
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          TA_DEF="package/mtk/applications/luci-app-turboacc-mtk/root/etc/uci-defaults/turboacc"

          if [ ! -f "$TA_DEF" ]; then
            echo "未找到 $TA_DEF —— 硬件加速（turboacc）已在配置中移除，无需设置"
            exit 0
          fi

          if [ "${{ env.HW_OFFLOAD }}" = "1" ]; then
            sed -i 's|"turboacc.config.fastpath"="mediatek_hnat"|"turboacc.config.fastpath"="mediatek_hnat"|' "$TA_DEF"
            sed -i 's|"turboacc.config.fastpath_mh_eth_hnat"="[01]"|"turboacc.config.fastpath_mh_eth_hnat"="1"|' "$TA_DEF"
            sed -i 's|"turboacc.config.fastpath_mh_eth_hnat_v6"="[01]"|"turboacc.config.fastpath_mh_eth_hnat_v6"="1"|' "$TA_DEF"
            echo "硬件加速: 开启（HNAT 生效，但代理与 OAF 将失效）"
          else
            sed -i 's|"turboacc.config.fastpath"="mediatek_hnat"|"turboacc.config.fastpath"="none"|' "$TA_DEF"
            sed -i 's|"turboacc.config.fastpath_mh_eth_hnat"="[01]"|"turboacc.config.fastpath_mh_eth_hnat"="0"|' "$TA_DEF"
            sed -i 's|"turboacc.config.fastpath_mh_eth_hnat_v6"="[01]"|"turboacc.config.fastpath_mh_eth_hnat_v6"="0"|' "$TA_DEF"
            echo "硬件加速: 已关闭（代理 PassWall 与 OAF 需要）"
          fi

          echo "--- turboacc uci-defaults 实际值 ---"
          grep -E 'turboacc.config.(fastpath|fastpath_mh_eth_hnat|fastpath_mh_eth_hnat_v6)' "$TA_DEF"

      - name: 执行 diy.sh
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          if [ -f "$GITHUB_WORKSPACE/diy.sh" ]; then
            cp "$GITHUB_WORKSPACE/diy.sh" openwrt_diy.sh
            chmod +x openwrt_diy.sh
            ./openwrt_diy.sh
          else
            echo "未发现 diy.sh，跳过"
          fi

      - name: 下载源码包
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          ccache -M "${{ env.CCACHE_MAXSIZE }}" 2>/dev/null || true
          make -j$(nproc) || make -j1 V=s
          ccache -s 2>/dev/null | head -12 || true

      # ======================== 组装模式 ========================
      - name: 安装组装工具
        if: ${{ env.ASSEMBLE == '1' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd xz-utils tar python3 file rsync
          sudo apt-get clean

      - name: 确认 profile
        if: ${{ env.ASSEMBLE == '1' }}
        run: |
          cd "$GITHUB_WORKSPACE/ib"
          make info 2>/dev/null | grep -iE "^${{ env.DEVICE }}:" || true
          echo "--- 全部 profile ---"
          make info 2>/dev/null | grep -E '^[a-z0-9_-]+:' | head -30

      - name: 准备定制文件
        if: ${{ env.ASSEMBLE == '1' }}
        run: |
          D="$GITHUB_WORKSPACE/files/etc/uci-defaults"
          mkdir -p "$D"

          # ⚠ 文件名必须是 zzz-custom 而非 99-custom：
          #   OpenWrt 的 uci-defaults 按【文件名排序】执行，
          #   '9'(ASCII 57) < 't'(116)，所以 99-custom 会先于包自带的
          #   turboacc 执行，随后被 turboacc 覆盖 —— 设置等于白写。
          #   zzz- 开头确保排在最后，覆盖 turboacc 的默认值。
          if [ "${{ env.HW_OFFLOAD }}" = "1" ]; then
            HW_FP=mediatek_hnat
            HW_HNAT=1
            HW_HNAT_V6=1
          else
            HW_FP=none
            HW_HNAT=0
            HW_HNAT_V6=0
          fi

          cat > "$D/zzz-custom" <<EOF
          #!/bin/sh
          uci -q batch <<'EOC'
          set network.lan.ipaddr='${{ env.LAN_IP }}'
          set system.@system[0].hostname='${{ env.HOSTNAME }}'
          set system.@system[0].timezone='${{ env.TIMEZONE }}'
          set system.@system[0].zonename='${{ env.ZONENAME }}'
          set luci.main.mediaurlbase='/luci-static/${{ env.THEME }}'
          set turboacc.config.fastpath='${HW_FP}'
          set turboacc.config.fastpath_mh_eth_hnat='${HW_HNAT}'
          set turboacc.config.fastpath_mh_eth_hnat_v6='${HW_HNAT_V6}'
          commit
          EOC
          exit 0
          EOF
          chmod +x "$D/zzz-custom"
          echo "硬件加速: ${HW_FP}"
          cat "$D/zzz-custom"

      - name: 组装固件
        id: assemble
        if: ${{ env.ASSEMBLE == '1' }}
        run: |
          cd "$GITHUB_WORKSPACE/ib"
          if [ "${MISSING_COUNT:-0}" != "0" ]; then
            echo "::error::${MISSING_COUNT} 个包不在 IB 中，请以 mode=full 运行"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}"
          cp -f "$GITHUB_WORKSPACE/${{ env.CONFIG_FILE }}" "$GITHUB_WORKSPACE/openwrt/.config"
          make image \
            PROFILE="${{ env.DEVICE }}" \
            PACKAGES="$AVAIL_PKGS" \
            FILES="$GITHUB_WORKSPACE/files" \
            BIN_DIR="$GITHUB_WORKSPACE/openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}" \
            EXTRA_IMAGE_NAME="assembled"
          ls -lh "$GITHUB_WORKSPACE/openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}"

      # ======================== 保存缓存 ========================
      - name: 保存 dl 缓存
        if: ${{ always() && env.USE_CACHE == 'true' && env.ASSEMBLE != '1' }}
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.DEVICE }}-${{ env.REPO_BRANCH }}-${{ env.CFG_HASH }}

      - name: 保存 Go/host 缓存
        if: ${{ always() && env.USE_CACHE == 'true' && env.ASSEMBLE != '1' }}
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/build_dir/host
            openwrt/build_dir/hostpkg
            openwrt/tmp/go-build
            openwrt/tmp/go-mod-cache
          key: go-${{ env.DEVICE }}-${{ env.REPO_BRANCH }}-${{ env.CFG_HASH }}

      - name: 保存 ccache
        if: ${{ always() && env.USE_CACHE == 'true' && env.ASSEMBLE != '1' }}
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.DEVICE }}-${{ env.REPO_BRANCH }}-${{ env.CFG_HASH }}

      - name: 保存 ImageBuilder
        if: ${{ success() && env.ASSEMBLE != '1' }}
        uses: actions/cache/save@v4
        with:
          path: openwrt/bin/targets/*/*/*imagebuilder*.tar.zst
          key: ib-${{ env.DEVICE }}-${{ env.REPO_BRANCH }}-${{ env.KERNEL }}

      # ======================== 整理产物 ========================
      - name: 整理产物
        run: |
          cd openwrt
          echo "FILE_DATE=$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M')" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp -f bin/targets/*/*/*${{ env.DEVICE }}*.bin "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          cp -f bin/targets/*/*/*.manifest "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          cp -f bin/targets/*/*/sha256sums "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          cp -f .config "$GITHUB_WORKSPACE/artifact/full.config" 2>/dev/null || true
          cp -f "$GITHUB_WORKSPACE/${{ env.CONFIG_FILE }}" "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          cp -f bin/targets/*/*/*imagebuilder*.tar.zst "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/artifact"

      - name: 上传 Artifacts（90 天）
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ env.DEVICE }}-${{ env.FILE_DATE }}
          path: artifact/*
          retention-days: 90
          if-no-files-found: error

      - name: 生成 Release 正文
        env:
          BUILD_START: ${{ env.BUILD_START }}
        run: |
          cd openwrt
          chmod +x "$GITHUB_WORKSPACE/gen-release-notes.sh"

          # 版本号：读取仓库 VERSION 文件第一行
          VERSION_TAG=$(head -1 "$GITHUB_WORKSPACE/VERSION" 2>/dev/null | tr -d ' \t\r')
          [ -z "$VERSION_TAG" ] && VERSION_TAG="unknown"
          export VERSION_TAG

          # 构建耗时：优先用 Actions 原生计时（精确），缺失时回退到自计时
          fmt_dur() {
            local ms="$1"
            [ -z "$ms" ] || [ "$ms" = "null" ] && return 1
            local s=$(( ms / 1000 ))
            [ "$s" -le 0 ] && return 1
            local h=$(( s / 3600 )) m=$(( (s % 3600) / 60 )) sec=$(( s % 60 ))
            if   [ "$h" -gt 0 ]; then echo "${h} 小时 ${m} 分"
            elif [ "$m" -gt 0 ]; then echo "${m} 分 ${sec} 秒"
            else                      echo "${sec} 秒"
            fi
          }
          if [ "${{ env.ASSEMBLE }}" = "1" ]; then
            DUR=$(fmt_dur "${{ steps.assemble.duration_ms }}" || true)
          else
            DUR=$(fmt_dur "${{ steps.compile.duration_ms }}" || true)
          fi
          if [ -z "$DUR" ] && [ -n "${BUILD_START:-}" ]; then
            ELAPSED=$(( $(date +%s) - BUILD_START ))
            [ "$ELAPSED" -gt 0 ] && DUR=$(fmt_dur $(( ELAPSED * 1000 )) || true)
          fi
          export BUILD_DURATION="${DUR:-未知}"
          echo "版本: $VERSION_TAG | 构建耗时: $BUILD_DURATION"

          export HEAD_SHORT="${{ needs.check.outputs.head_short }}"
          export HEAD_DATE="${{ needs.check.outputs.head_date }}"
          export HEAD_MSG="${{ needs.check.outputs.head_msg }}"
          export TRIGGER_REASON="${{ needs.check.outputs.reason }}"
          "$GITHUB_WORKSPACE/gen-release-notes.sh" "$GITHUB_WORKSPACE/release-notes.md"
          head -40 "$GITHUB_WORKSPACE/release-notes.md"

      - name: 发布 Release（永久保留）
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.DEVICE }}-${{ env.FILE_DATE }}-r${{ github.run_number }}
          name: ${{ env.DEVICE }} · ImmortalWrt · kernel ${{ env.KERNEL }} · ${{ env.FILE_DATE }} ${{ env.ASSEMBLE == '1' && '· 组装' || '· 完整编译' }}
          body_path: ${{ github.workspace }}/release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: artifact/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-state:
    needs: [check, build]
    if: ${{ always() && needs.check.outputs.should_build == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 记录已构建提交
        uses: actions/github-script@v8
        with:
          script: |
            const sha = '${{ needs.check.outputs.head_sha }}';
            const path = '${{ env.STATE_FILE }}';
            const content = Buffer.from(`${sha}\n`).toString('base64');
            let fileSha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: context.payload.repository.default_branch
              });
              fileSha = data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: context.payload.repository.default_branch,
              message: `chore: record built commit ${sha.slice(0, 7)}`,
              content,
              ...(fileSha ? { sha: fileSha } : {}),
            });
