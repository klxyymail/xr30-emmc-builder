on:name: Build ImmortalWrt 24.10 (k6.6) for CMCC XR30 eMMC

# ============================================================================
#  所有可变内容都在 configs/<机型名>.config 里：
#    加插件        → 配置文件里加 CONFIG_PACKAGE_xxx=y
#    加第三方仓库  → 配置文件的 ## [feeds] 段加一行
#    换机型        → 复制一份 .config 改名，Actions 页面自动出现选项
#    换源码/分支   → 改 ## [source] 段
#    改 IP/主机名  → 改 ## [custom] 段
#
#  加新机型的方法：复制 configs/ 下任一 .config，改文件名与内容即可，
#  本文件和 Actions 的选项都不用动（选项用文本输入，自动发现 configs/ 内容）
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      config:
        description: cmcc_rax3000m-emmc-mtk.config
        required: false
        default: ''
        type: string
      mode:
        description: '构建模式'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto        # 有 ImageBuilder 缓存就组装，否则完整编译
          - assemble    # 强制组装（没有 IB 则报错）
          - full        # 强制完整编译（会重新生成 ImageBuilder）
      enable_ssh:
        description: '编译失败时开启 SSH 调试 (tmate)'
        required: false
        default: false
        type: boolean
      use_cache:
        description: '启用缓存加速（dl 下载 + ccache + Go 缓存）'
        required: false
        default: true
        type: boolean

  # 定时触发：仅在检测到上游源码有新提交时才构建
  # UTC 周二 02:00 = 北京时间周二 10:00
  # 注：定时构建时自动使用 configs/ 下第一个配置文件
  schedule:
    - cron: '0 2 * * 2'

permissions:
  contents: write

# 同一时间只允许一个构建在跑，避免定时任务与手动触发打架
concurrency:
  group: build-firmware
  cancel-in-progress: false

env:
  CONFIG_DIR: configs
  STATE_FILE: .upstream-commit
  # ccache 设置（OpenWrt 原生 CONFIG_CCACHE 会读取这些）
  # 2G 而非常见的 5G：GitHub 每个仓库缓存总配额 10GB，
  # 需要与 ImageBuilder / dl / Go 缓存共存，ccache 过大会挤掉它们。
  # 且组装模式成为主路径后完整编译跑得少，ccache 无需太大。
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: '1'
  TZ: Asia/Shanghai

jobs:
  # ------------------------------------------------------------------
  # 选配置 + 检测上游是否有新提交
  # ------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.changed }}
      config_file: ${{ steps.cfg.outputs.file }}
      device: ${{ steps.cfg.outputs.device }}
      head_sha: ${{ steps.fetch.outputs.sha }}
      head_short: ${{ steps.fetch.outputs.short }}
      head_msg: ${{ steps.fetch.outputs.msg }}
      head_date: ${{ steps.fetch.outputs.date }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v5

      - name: 选择并解析机型配置
        id: cfg
        run: |
          cd "$CONFIG_DIR"

          echo "=== configs/ 下可用的机型配置 ==="
          ls -1 *.config 2>/dev/null | sed 's/^/  - /' || true
          echo

          # 确定用哪个配置文件
          CFG_INPUT="${{ inputs.config }}"
          if [ -n "$CFG_INPUT" ]; then
            CFG_FILE="$CFG_INPUT"
            # 容错：用户可能写了 configs/ 前缀或漏了 .config 后缀
            CFG_FILE=$(basename "$CFG_FILE" .config).config
            if [ ! -f "$CFG_FILE" ]; then
              echo "::error::找不到配置文件 $CFG_FILE"
              echo "可用配置："
              ls -1 *.config
              exit 1
            fi
            echo "使用指定配置: $CFG_FILE"
          else
            CFG_FILE=$(ls -1 *.config 2>/dev/null | head -1)
            if [ -z "$CFG_FILE" ]; then
              echo "::error::configs/ 目录下没有找到任何 .config 文件"
              exit 1
            fi
            echo "未指定，自动选择第一个: $CFG_FILE"
          fi
          echo "file=$CFG_FILE" >> "$GITHUB_OUTPUT"

          # ---- 解析元数据段 ----
          # 用法: meta <段名> <键名>
          meta() {
            sed -n "/^## \[$1\]/,/^## \[/p" "$CFG_FILE" \
              | grep -E "^##[[:space:]]+$2[[:space:]]*=" \
              | head -1 \
              | sed -E "s/^##[[:space:]]+$2[[:space:]]*=[[:space:]]*//" \
              | sed -E 's/[[:space:]]+$//'
          }

          REPO=$(meta source repo)
          BRANCH=$(meta source branch)
          DEVICE=$(meta device device)
          TARGET=$(meta device target)
          SUBTARGET=$(meta device subtarget)

          for v in "repo:$REPO" "branch:$BRANCH" "device:$DEVICE" \
                   "target:$TARGET" "subtarget:$SUBTARGET"; do
            key="${v%%:*}"; val="${v#*:}"
            if [ -z "$val" ]; then
              echo "::error::配置文件 $CFG_FILE 的 [source]/[device] 段缺少 $key"
              exit 1
            fi
          done

          echo "repo=$REPO"       >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"   >> "$GITHUB_OUTPUT"
          echo "device=$DEVICE"   >> "$GITHUB_OUTPUT"
          echo "target=$TARGET"   >> "$GITHUB_OUTPUT"
          echo "subtarget=$SUBTARGET" >> "$GITHUB_OUTPUT"

          # 回显到日志，方便核对
          echo
          echo "=== 解析结果 ==="
          echo "  源码仓库 : $REPO"
          echo "  分支     : $BRANCH"
          echo "  设备目标 : $TARGET / $SUBTARGET / $DEVICE"
          echo
          echo "  第三方仓库:"
          sed -n "/^## \[feeds\]/,/^## \[/p" "$CFG_FILE" \
            | grep -E '^##[[:space:]]+[A-Za-z0-9_-]+[[:space:]]*=' \
            | sed -E 's/^##[[:space:]]+([A-Za-z0-9_-]+)[[:space:]]*=[[:space:]]*(.*)$/    \1 -> \2/' \
            | sed -E 's/[[:space:]]+$//'

      - name: 获取上游最新提交
        id: fetch
        run: |
          set -e
          SHA=$(git ls-remote "${{ steps.cfg.outputs.repo }}" \
                  "refs/heads/${{ steps.cfg.outputs.branch }}" | awk '{print $1}')
          if [ -z "$SHA" ]; then
            echo "::error::无法获取上游分支 ${{ steps.cfg.outputs.branch }} 的提交号"
            exit 1
          fi
          echo "上游 HEAD: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

          # 上游提交信息与日期（读公开仓库，带 token 提高限流额度）
          REPO_PATH=$(echo "${{ steps.cfg.outputs.repo }}" \
                      | sed -E 's#https://github.com/##; s#\.git$##')
          JSON=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/$REPO_PATH/commits/$SHA" || true)
          MSG=$(echo "$JSON" | jq -r '.commit.message // ""' 2>/dev/null \
                | head -n1 | cut -c1-200 | tr -d '`${}' || true)
          DATE=$(echo "$JSON" | jq -r '.commit.author.date // ""' 2>/dev/null || true)
          echo "msg=${MSG:-（未获取到提交信息）}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE:-未知}" >> "$GITHUB_OUTPUT"

      - name: 决定是否构建
        id: decide
        uses: actions/github-script@v8
        with:
          script: |
            const sha = '${{ steps.fetch.outputs.sha }}';
            const branch = '${{ steps.cfg.outputs.branch }}';
            const device = '${{ steps.cfg.outputs.device }}';
            const cfgFile = '${{ steps.cfg.outputs.file }}';

            // 状态文件按机型分开记录，多机型互不干扰
            const stateFile = `.upstream-commit-${device}`;

            let prev = '';
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: stateFile,
                ref: context.payload.repository.default_branch
              });
              prev = Buffer.from(data.content, 'base64').toString('utf8').trim();
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const changed = prev !== sha;

            core.info(`机型:       ${device}`);
            core.info(`配置文件:   ${cfgFile}`);
            core.info(`上游分支:   ${branch}`);
            core.info(`已构建提交: ${prev || '（无，首次运行）'}`);
            core.info(`上游最新:   ${sha}`);
            core.info(`是否有更新: ${changed}`);

            // 只有两种触发方式：手动 与 定时
            let shouldBuild, reason;
            if (context.eventName === 'workflow_dispatch') {
              shouldBuild = true;
              reason = '手动触发';
              core.info('手动触发，跳过更新检测');
            } else if (changed) {
              shouldBuild = true;
              reason = '上游有更新';
            } else {
              shouldBuild = false;
              reason = '上游无更新，跳过';
            }

            core.setOutput('changed', String(shouldBuild));
            core.setOutput('reason', reason);

            await core.summary.addRaw([
              '## 构建决策',
              '',
              '| 项目 | 值 |',
              '| --- | --- |',
              `| 配置文件 | \`${cfgFile}\` |`,
              `| 设备目标 | \`${device}\` |`,
              `| 上游分支 | \`${branch}\` |`,
              `| 已构建提交 | \`${(prev || '无').slice(0, 7)}\` |`,
              `| 上游最新提交 | \`${sha.slice(0, 7)}\` |`,
              `| 是否有更新 | ${changed ? '是' : '否'} |`,
              `| 触发原因 | ${reason} |`,
              `| 本次动作 | ${shouldBuild ? '**构建固件**' : '跳过'} |`,
            ].join('\n')).write();

  # ------------------------------------------------------------------
  # 编译固件
  # ------------------------------------------------------------------
  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      USE_CACHE: ${{ github.event_name == 'schedule' || inputs.use_cache }}
      CFG: ${{ needs.check.outputs.config_file }}

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v5

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: 构建环境信息
        run: |
          echo "CPU 核心: $(nproc)"
          free -h
          df -hT /

      - name: 安装编译依赖
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo apt-get clean

      - name: 解析机型配置
        id: meta
        run: |
          F="$CONFIG_DIR/$CFG"
          meta() {
            sed -n "/^## \[$1\]/,/^## \[/p" "$F" \
              | grep -E "^##[[:space:]]+$2[[:space:]]*=" \
              | head -1 \
              | sed -E "s/^##[[:space:]]+$2[[:space:]]*=[[:space:]]*//" \
              | sed -E 's/[[:space:]]+$//'
          }
          echo "REPO_URL=$(meta source repo)"       >> "$GITHUB_ENV"
          echo "REPO_BRANCH=$(meta source branch)"  >> "$GITHUB_ENV"
          # 配置文件内容指纹，用于缓存 key。
          # 这里用 shell 计算而非 hashFiles(format(...)) ——
          # GitHub Actions 表达式不支持函数嵌套，会直接报错。
          echo "CFG_HASH=$(md5sum "$F" | cut -d' ' -f1 | cut -c1-12)" >> "$GITHUB_ENV"
          echo "TARGET=$(meta device target)"       >> "$GITHUB_ENV"
          echo "SUBTARGET=$(meta device subtarget)" >> "$GITHUB_ENV"
          echo "DEVICE_NAME=$(meta device device)"  >> "$GITHUB_ENV"
          echo "DEFCONFIG=$(meta device defconfig)" >> "$GITHUB_ENV"
          echo "LAN_IP=$(meta custom lan_ip)"       >> "$GITHUB_ENV"
          echo "HOSTNAME=$(meta custom hostname)"   >> "$GITHUB_ENV"
          echo "TZONE=$(meta custom timezone)"      >> "$GITHUB_ENV"
          echo "ZONENAME=$(meta custom zonename)"   >> "$GITHUB_ENV"
          echo "THEME=$(meta custom theme)"         >> "$GITHUB_ENV"

          # 第三方仓库导出为 FEED_<序号> 环境变量
          # 提取后每行为 "名字 仓库地址;分支"（保留名字，feeds.conf 需要它）
          i=0
          sed -n "/^## \[feeds\]/,/^## \[/p" "$F" \
            | grep -E '^##[[:space:]]+[A-Za-z0-9_-]+[[:space:]]*=' \
            | sed -E 's/^##[[:space:]]+([A-Za-z0-9_-]+)[[:space:]]*=[[:space:]]*(.*)$/\1 \2/' \
            | sed -E 's/[[:space:]]+$//' \
            | while IFS= read -r line; do
                [ -z "$line" ] && continue
                echo "FEED_$i=$line" >> "$GITHUB_ENV"
                i=$((i+1))
              done
          echo "=== 解析到的第三方仓库 ==="
          sed -n "/^## \[feeds\]/,/^## \[/p" "$F" \
            | grep -E '^##[[:space:]]+[A-Za-z0-9_-]+[[:space:]]*=' \
            | sed -E 's/^##[[:space:]]+([A-Za-z0-9_-]+)[[:space:]]*=[[:space:]]*(.*)$/    \1 -> \2/'

      - name: 拉取源码
        run: |
          git clone --depth 1 --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          KV=$(grep -m1 -E '^LINUX_VERSION-(6\.6|5\.4|5\.15) *=' include/kernel-* 2>/dev/null \
               | head -1 | awk '{print $3}')
          echo "KERNEL=${KV:-未知}" >> "$GITHUB_ENV"

      # ==================================================================
      #  【组装模式判定】
      #
      #  ImageBuilder 是完整编译的副产物，内含：
      #    预编译内核 + 所有 kmod（含闭源 mt_wifi）+ 全部 .ipk 包仓库
      #  拿到它之后改固件 = make image = 纯组装，不编译任何东西，约 3-10 分钟。
      #
      #  cache key 用【内核版本】而非源码 commit：
      #    内核不变 → IB 内部 kmod 与内核天然匹配（vermagic 一致），可安全复用
      #    内核变了 → 必须重新完整编译，否则产出的是旧内核固件
      #  这里刻意不用 restore-keys 回退，避免误用旧内核的 IB。
      # ==================================================================
      - name: 尝试恢复 ImageBuilder
        id: try_ib
        if: ${{ inputs.mode != 'full' }}
        uses: actions/cache/restore@v4
        with:
          path: ibcache
          key: ib-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-${{ env.KERNEL }}

      - name: 解压 ImageBuilder 并检测包完整性
        if: ${{ inputs.mode != 'full' }}
        run: |
          IB=$(ls ibcache/*imagebuilder*.tar.zst 2>/dev/null | head -1)
          if [ -z "$IB" ]; then
            echo "IB_HIT=0" >> "$GITHUB_ENV"
            echo "未命中 ImageBuilder 缓存"
            exit 0
          fi

          echo "IB_HIT=1" >> "$GITHUB_ENV"
          echo "解压 $IB ..."
          command -v zstd >/dev/null || sudo apt-get install -y -qq zstd
          mkdir -p "$GITHUB_WORKSPACE/ib"
          tar -I zstd -xf "$GITHUB_WORKSPACE/$IB" -C "$GITHUB_WORKSPACE/ib" --strip-components=1
          echo "内嵌包数量: $(ls "$GITHUB_WORKSPACE/ib"/packages/*.ipk 2>/dev/null | wc -l)"

          # 提前算出配置里哪些包在 IB 中不存在。
          # 这一步必须在决定构建路径【之前】做：
          #   缺失包为空 → 走组装（3-10 分钟）
          #   缺失包非空 → 转完整编译（把新包编译进 IB）
          # 若不做检测而直接组装，新包会被静默跳过，
          # 用户会拿到一个"以为加了插件其实没加"的固件。
          # ---- 区分「真包名」与「伪配置项」----
          # 配置文件里存在两类非包名的项：
          #   ① 功能开关：dnsmasq_full_auth（真身是 dnsmasq-full）
          #   ② 模式选项：luci-app-ssr-plus_Nftables_Transparent_Proxy（真身 luci-app-ssr-plus）
          # 它们的共同形式是 <真包名>_<选项>，因此逐级截掉下划线后缀回退匹配：
          # 能匹配到 IB 中已存在的包 → 认定为该包的选项，静默忽略；
          # 截到底都匹配不上 → 才是真正缺失、需要编译的新包。
          # 不做这层区分的话，每次都会被误判为"有缺失"而永远走完整编译。
          PKGS=$(grep -oE '^CONFIG_PACKAGE_[A-Za-z0-9_.-]+=y' \
                   "$GITHUB_WORKSPACE/$CONFIG_DIR/$CFG" \
                 | sed 's/^CONFIG_PACKAGE_//; s/=y$//' \
                 | grep -vE '_INCLUDE_|_EXCLUDE_' | sort -u)

          pkg_exists() {
            local n="$1" alt
            alt=$(echo "$n" | tr '_' '-')          # dnsmasq_full -> dnsmasq-full
            ls "$GITHUB_WORKSPACE/ib"/packages/"${n}_"*.ipk >/dev/null 2>&1 && return 0
            [ "$n" != "$alt" ] && ls "$GITHUB_WORKSPACE/ib"/packages/"${alt}_"*.ipk >/dev/null 2>&1 && return 0
            return 1
          }
          is_option_of_existing_pkg() {
            local cur="$1"
            while [ "$cur" != "${cur%_*}" ]; do
              cur="${cur%_*}"
              [ -z "$cur" ] && break
              pkg_exists "$cur" && return 0
            done
            return 1
          }

          AVAIL=""; MISSING=""
          for p in $PKGS; do
            if pkg_exists "$p"; then
              AVAIL="$AVAIL $p"
            elif is_option_of_existing_pkg "$p"; then
              continue
            else
              MISSING="$MISSING $p"
            fi
          done

          echo "AVAIL_PKGS=$AVAIL" >> "$GITHUB_ENV"
          echo "MISSING_PKGS=$MISSING" >> "$GITHUB_ENV"
          echo "MISSING_COUNT=$(echo $MISSING | wc -w)" >> "$GITHUB_ENV"
          echo "配置候选包 $(echo $PKGS | wc -w) 个 → 可装 $(echo $AVAIL | wc -w) 个 / 缺失 $(echo $MISSING | wc -w) 个"
          if [ -n "$MISSING" ]; then
            echo "----------------------------------------------------------"
            echo "IB 中缺少以下 $(echo $MISSING | wc -w) 个包（需要编译的新插件）："
            for p in $MISSING; do echo "  - $p"; done
            echo "----------------------------------------------------------"
          fi

      - name: 决定构建路径
        run: |
          MODE="${{ inputs.mode }}"
          [ -z "$MODE" ] && MODE="auto"

          echo "模式: $MODE | 内核: ${KERNEL} | IB 命中: ${IB_HIT:-0} | 缺失包: ${MISSING_COUNT:-0}"

          if [ "$MODE" = "full" ]; then
            echo "ASSEMBLE=0" >> "$GITHUB_ENV"
            echo "选定路径: 完整编译（mode=full 手动指定）"
          elif [ "${IB_HIT:-0}" != "1" ]; then
            if [ "$MODE" = "assemble" ]; then
              echo "::error::assemble 模式但未找到匹配的 ImageBuilder"
              echo "::error::请先以 mode=full 运行一次生成 ImageBuilder"
              exit 1
            fi
            echo "ASSEMBLE=0" >> "$GITHUB_ENV"
            echo "选定路径: 完整编译（首次运行，需生成 ImageBuilder，预计 1-3 小时）"
          elif [ "${MISSING_COUNT:-0}" != "0" ]; then
            if [ "$MODE" = "assemble" ]; then
              echo "::error::assemble 模式但配置里有 $(echo $MISSING_PKGS | wc -w) 个包不在 ImageBuilder 中："
              echo "::error::$MISSING_PKGS"
              echo "::error::请改用 mode=full，让这些包被编译进 ImageBuilder"
              exit 1
            fi
            # 自动转完整编译 —— 结果正确优先于速度
            echo "ASSEMBLE=0" >> "$GITHUB_ENV"
            echo "选定路径: 完整编译（配置含 ${MISSING_COUNT} 个新包，需编译进 IB）"
            echo "预计 20-40 分钟：已编译的包全部命中 ccache，只编译新增的这几个"
          else
            echo "ASSEMBLE=1" >> "$GITHUB_ENV"
            echo "选定路径: 组装（包齐全，预计 3-10 分钟）"
          fi

      # ==================================================================
      #  三层缓存：dl 下载 → Go/host 工具链 → ccache 编译对象
      #  key 都绑定「配置文件内容 + 源码分支 + 源码提交」，
      #  任一变化都会自动失效，避免命中 ABI 不兼容的旧缓存
      # ==================================================================
      - name: 恢复 dl 下载缓存
        if: ${{ env.USE_CACHE == 'true' && env.ASSEMBLE != '1' }}
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-${{ env.CFG_HASH }}
          restore-keys: |
            dl-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-
            dl-${{ env.DEVICE_NAME }}-

      - name: 恢复 Go 与 host 工具链缓存
        if: ${{ env.USE_CACHE == 'true' && env.ASSEMBLE != '1' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/build_dir/host
            openwrt/build_dir/hostpkg
            openwrt/tmp/go-build
            openwrt/tmp/go-mod-cache
          key: go-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-${{ env.CFG_HASH }}
          restore-keys: |
            go-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-
            go-${{ env.DEVICE_NAME }}-

      - name: 恢复 ccache 编译缓存
        if: ${{ env.USE_CACHE == 'true' && env.ASSEMBLE != '1' }}
        uses: actions/cache/restore@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-${{ env.CFG_HASH }}
          restore-keys: |
            ccache-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-
            ccache-${{ env.DEVICE_NAME }}-

      - name: 配置 feeds 源（来自配置文件的 [feeds] 段）
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          # 顺序很重要：scripts/feeds 的 lookup_package() 按 feeds.conf 书写顺序
          # 取第一个命中该包的源，【靠前的优先级更高】，先安装者不被后者覆盖。
          # 因此第三方源一律追加到末尾 —— 官方源优先，第三方仅作补充。
          env | grep -E '^FEED_[0-9]+=' | sed 's/^FEED_[0-9]*=//' | sort -t_ -k2 -n \
            | while IFS= read -r line; do
                [ -z "$line" ] && continue
                # 行格式: 名字 仓库地址;分支  → 转成 src-git 名字 地址;分支
                NAME=$(echo "$line" | awk '{print $1}')
                URL=$(echo "$line"  | awk '{print $2}')
                if [ -n "$NAME" ] && [ -n "$URL" ]; then
                  echo "src-git $NAME $URL" >> feeds.conf.default
                  echo "  + $NAME -> $URL"
                fi
              done
          echo "=== 最终 feeds 配置（靠前 = 优先级高）==="
          cat feeds.conf.default

      - name: 更新并安装 feeds
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "=== 关键包就位校验 ==="
          for p in luci-app-passwall luci-theme-argon luci-app-argon-config \
                   luci-app-ssr-plus shadowsocksr-libev \
                   luci-app-store luci-lib-taskd luci-lib-xterm taskd \
                   luci-app-ddns-go ddns-go; do
            # istore 的包位于 luci/ 子目录，故用 -maxdepth 3
            if find package/feeds -maxdepth 3 -name "$p" -type d 2>/dev/null | grep -q .; then
              echo "  [OK]   $p"
            else
              echo "  [缺失] $p"
            fi
          done

      - name: 载入机型配置
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          cp -f "defconfig/${DEFCONFIG}" .config

          # 官方 defconfig 是 MULTI_PROFILE，一次编十几个机型。
          # 这里改成单机型单 profile：
          #   1. 删掉所有 CONFIG_TARGET_DEVICE_xxx 行
          #   2. 关掉 MULTI_PROFILE 和 PER_DEVICE_ROOTFS
          #   3. 写入本配置指定的 target / subtarget / device
          sed -i '/^CONFIG_TARGET_DEVICE_/d' .config
          sed -i 's/^CONFIG_TARGET_MULTI_PROFILE=y/# CONFIG_TARGET_MULTI_PROFILE is not set/' .config
          sed -i 's/^CONFIG_TARGET_PER_DEVICE_ROOTFS=y/# CONFIG_TARGET_PER_DEVICE_ROOTFS is not set/' .config
          sed -i "/^CONFIG_TARGET_${TARGET}_[A-Za-z0-9_]*=y$/d" .config

          # ---- 产出 ImageBuilder（完整编译时）----
          # CONFIG_IB 默认是 BUILDBOT（通常为 n），必须显式开启才会生成。
          # CONFIG_IB_STANDALONE 默认 y（非 BUILDBOT 时），会把【所有】编译出来的
          # .ipk 内嵌进 ImageBuilder，之后组装时无需在线包仓库。
          # 依据 target/imagebuilder/Makefile：STANDALONE 时执行
          #   find $(PACKAGE_SUBDIRS) -name '*.ipk' -exec cp -t packages/ {} +
          echo "CONFIG_IB=y" >> .config
          echo "CONFIG_IB_STANDALONE=y" >> .config

          cat >> .config <<EOF
          CONFIG_TARGET_${TARGET}=y
          CONFIG_TARGET_${TARGET}_${SUBTARGET}=y
          CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${DEVICE_NAME}=y
          EOF

          # 追加用户插件配置（去掉 ## 元数据段，只留 CONFIG_ 部分）
          grep -v '^##' "$GITHUB_WORKSPACE/$CONFIG_DIR/$CFG" >> .config

          make defconfig

          echo "=== 机型选择结果 ==="
          grep -E "^CONFIG_TARGET_${TARGET}|^CONFIG_TARGET_MULTI_PROFILE" .config
          echo "=== 关键插件确认 ==="
          for k in luci-app-passwall luci-app-ssr-plus luci-app-store \
                   luci-app-ddns-go luci-theme-argon; do
            grep -m1 "^CONFIG_PACKAGE_${k}=" .config || echo "  $k 未启用"
          done

      - name: 应用定制项（来自配置文件的 [custom] 段）
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          CFG_GEN="package/base-files/files/bin/config_generate"
          [ -f "$CFG_GEN" ] || { echo "未找到 config_generate，跳过定制"; exit 0; }

          [ -n "$LAN_IP" ] && sed -i "s/192\.168\.[0-9]\+\.1/$LAN_IP/g" "$CFG_GEN"
          [ -n "$HOSTNAME" ] && sed -i "s/hostname='[A-Za-z0-9_-]*'/hostname='$HOSTNAME'/" "$CFG_GEN"
          [ -n "$TZONE" ] && sed -i "s/timezone='[A-Za-z0-9+-]*'/timezone='$TZONE'/" "$CFG_GEN"
          [ -n "$ZONENAME" ] && sed -i "s#zonename='[A-Za-z0-9/_-]*'#zonename='$ZONENAME'#" "$CFG_GEN"

          # 默认主题：改 luci-base 内置配置，只在全新刷机/重置时生效，
          # 不会在每次启动时覆盖用户选择（区别于 uci-defaults 写法）
          if [ -n "$THEME" ]; then
            LUCI_CFG=$(find feeds package -type f -path '*luci-base*' -name 'luci' \
                       -path '*etc/config*' 2>/dev/null | head -1)
            if [ -n "$LUCI_CFG" ]; then
              if grep -q 'mediaurlbase' "$LUCI_CFG"; then
                sed -i "s|option mediaurlbase .*|option mediaurlbase '/luci-static/$THEME'|" "$LUCI_CFG"
              else
                sed -i "/config core 'main'/a\\\toption mediaurlbase '/luci-static/$THEME'" "$LUCI_CFG"
              fi
              echo "默认主题已设为: $THEME"
            fi
          fi
          echo "=== 定制结果 ==="
          grep -E "lan) ipad|-- set|hostname=|timezone=|zonename=" "$CFG_GEN" 2>/dev/null | head -8

      - name: 执行 diy.sh（可选的高级定制）
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          if [ -f "$GITHUB_WORKSPACE/diy.sh" ]; then
            cp "$GITHUB_WORKSPACE/diy.sh" openwrt_diy.sh 2>/dev/null || true
            chmod +x openwrt_diy.sh
            ./openwrt_diy.sh
          else
            echo "未发现 diy.sh，跳过"
          fi

      - name: 下载源码包
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        if: ${{ env.ASSEMBLE != '1' }}
        run: |
          cd openwrt
          ccache -M "$CCACHE_MAXSIZE" 2>/dev/null || true
          make -j$(nproc) || make -j1 V=s
          echo "=== ccache 统计 ==="
          ccache -s 2>/dev/null | head -12 || true

      # ==================================================================
      #  【组装模式】用 ImageBuilder 直接拼固件，不编译任何东西
      #  耗时约 3-10 分钟，与完整编译的 1-3 小时形成对比
      # ==================================================================
      - name: 安装组装工具
        if: ${{ env.ASSEMBLE == '1' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            zstd xz-utils tar python3 file rsync
          sudo apt-get clean

      - name: 确认机型 profile
        if: ${{ env.ASSEMBLE == '1' }}
        run: |
          cd "$GITHUB_WORKSPACE/ib"
          make info 2>/dev/null | grep -iE "^${DEVICE_NAME}:" || true
          echo "--- 全部可用 profile ---"
          make info 2>/dev/null | grep -E '^[a-z0-9_-]+:' | head -30

      - name: 准备定制文件（FILES 注入）
        if: ${{ env.ASSEMBLE == '1' }}
        run: |
          # ImageBuilder 没有源码树，定制走 FILES 注入 + uci-defaults
          # （uci-defaults 只在首次启动执行一次，与源码树改法等效）
          D="$GITHUB_WORKSPACE/ibfiles/etc/uci-defaults"
          mkdir -p "$D"
          cat > "$D/99-custom" <<EOF
          #!/bin/sh
          uci -q batch <<'EOC'
          set network.lan.ipaddr='${LAN_IP}'
          set system.@system[0].hostname='${HOSTNAME}'
          set system.@system[0].timezone='${TZONE}'
          set system.@system[0].zonename='${ZONENAME}'
          set luci.main.mediaurlbase='/luci-static/${THEME}'
          commit
          EOC
          exit 0
          EOF
          chmod +x "$D/99-custom"
          echo "=== 注入的定制 ==="; cat "$D/99-custom"

      - name: 组装固件
        if: ${{ env.ASSEMBLE == '1' }}
        run: |
          cd "$GITHUB_WORKSPACE/ib"

          # 直接复用「解压 ImageBuilder 并检测包完整性」步骤算好的结果，
          # 避免同一套判定逻辑在两处各写一遍、改一处漏一处。
          AVAIL="$AVAIL_PKGS"
          echo "待装包: $(echo $AVAIL | wc -w) 个"

          # 走到这里本不该有缺失（前面已检测，有缺失会自动转完整编译）。
          # 若仍出现说明 IB 状态与检测时不一致，必须中止而非产出缺包固件。
          if [ "${MISSING_COUNT:-0}" != "0" ]; then
            echo "::error::以下 $(echo $MISSING_PKGS | wc -w) 个包不在 ImageBuilder 中："
            for p in $MISSING_PKGS; do echo "::error::  - $p"; done
            echo "::error::中止组装，避免产出缺少插件的固件。请以 mode=full 运行一次。"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/openwrt/bin/targets/$TARGET/$SUBTARGET"

          # 组装模式没有源码树 .config，把机型配置放过去，
          # 供 Release 正文生成脚本在 manifest 缺失时回退读取
          cp -f "$GITHUB_WORKSPACE/$CONFIG_DIR/$CFG" "$GITHUB_WORKSPACE/openwrt/.config"

          make image \
            PROFILE="$DEVICE_NAME" \
            PACKAGES="$AVAIL" \
            FILES="$GITHUB_WORKSPACE/ibfiles" \
            BIN_DIR="$GITHUB_WORKSPACE/openwrt/bin/targets/$TARGET/$SUBTARGET" \
            EXTRA_IMAGE_NAME="assembled"

          echo "=== 组装产物 ==="
          ls -lh "$GITHUB_WORKSPACE/openwrt/bin/targets/$TARGET/$SUBTARGET"

      - name: 组装失败排查提示
        if: ${{ failure() && env.ASSEMBLE == '1' }}
        run: |
          echo "::error::组装失败。常见原因："
          echo "::error::1. 配置文件里有 ImageBuilder 中不存在的包 —— 该包在生成 IB 的那次完整编译时没被编译"
          echo "::error::   解决：先以 mode=full 跑一次，让新包进入 IB 包仓库"
          echo "::error::2. PROFILE 名不匹配 —— 见上方 '确认机型 profile' 步骤的实际列表"
          echo "::error::3. 磁盘空间不足（IB 解压后较大）"
          df -hT

      - name: 保存 dl 缓存
        if: ${{ always() && env.USE_CACHE == 'true' && env.ASSEMBLE != '1' }}
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-${{ env.CFG_HASH }}

      - name: 保存 Go 与 host 工具链缓存
        if: ${{ always() && env.USE_CACHE == 'true' && env.ASSEMBLE != '1' }}
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/build_dir/host
            openwrt/build_dir/hostpkg
            openwrt/tmp/go-build
            openwrt/tmp/go-mod-cache
          key: go-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-${{ env.CFG_HASH }}

      - name: 保存 ccache 编译缓存
        if: ${{ always() && env.USE_CACHE == 'true' && env.ASSEMBLE != '1' }}
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-${{ env.CFG_HASH }}

      # ImageBuilder 是完整编译的副产物，保存下来供 assemble 模式复用。
      # key 刻意【不含】CFG_HASH —— 只要机型与分支不变就能复用，
      # 这样调整插件清单（配置文件）时不必重新完整编译。
      # 代价：新增此前没编译过的包时，需手动跑一次 full 重建 IB。
      - name: 保存 ImageBuilder（供组装模式复用）
        if: ${{ success() && env.ASSEMBLE != '1' }}
        uses: actions/cache/save@v4
        with:
          path: openwrt/bin/targets/*/*/*imagebuilder*.tar.zst
          key: ib-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-${{ env.KERNEL }}

      - name: 整理产物
        run: |
          cd openwrt
          echo "FILE_DATE=$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M')" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp -f bin/targets/*/*/*${DEVICE_NAME}*.bin "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          cp -f bin/targets/*/*/*.manifest  "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          cp -f bin/targets/*/*/config.buildinfo "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          cp -f bin/targets/*/*/sha256sums  "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          cp -f .config "$GITHUB_WORKSPACE/artifact/full.config" 2>/dev/null || true
          cp -f "$GITHUB_WORKSPACE/$CONFIG_DIR/$CFG" "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          # ImageBuilder 体积较大，默认不进 Release，只随 Artifacts 留存 90 天；
          # 需要时可自行下载后在本地跑 make image 组装。
          cp -f bin/targets/*/*/*imagebuilder*.tar.zst "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/artifact"

      - name: 上传到 Artifacts（短期镜像，90 天）
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ env.DEVICE_NAME }}-${{ env.FILE_DATE }}
          path: artifact/*
          retention-days: 90
          if-no-files-found: error

      - name: 生成 Release 正文
        run: |
          cd openwrt
          chmod +x "$GITHUB_WORKSPACE/gen-release-notes.sh"
          export HEAD_SHORT="${{ needs.check.outputs.head_short }}"
          export HEAD_DATE="${{ needs.check.outputs.head_date }}"
          export HEAD_MSG="${{ needs.check.outputs.head_msg }}"
          export TRIGGER_REASON="${{ needs.check.outputs.reason }}"
          "$GITHUB_WORKSPACE/gen-release-notes.sh" "$GITHUB_WORKSPACE/release-notes.md"
          echo "--- 正文预览 ---"
          head -40 "$GITHUB_WORKSPACE/release-notes.md"

      - name: 发布到 Release（永久保留）
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.DEVICE_NAME }}-${{ env.FILE_DATE }}-r${{ github.run_number }}
          name: ${{ env.DEVICE_NAME }} · ImmortalWrt · kernel ${{ env.KERNEL }} · ${{ env.FILE_DATE }} ${{ env.ASSEMBLE == '1' && '· 组装' || '· 完整编译' }}
          body_path: ${{ github.workspace }}/release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: artifact/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 失败时开启 SSH 调试
        if: ${{ failure() && github.event_name == 'workflow_dispatch' && inputs.enable_ssh }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30

  # ------------------------------------------------------------------
  # 构建成功后记录提交号；失败则不写，下个周期自动重试
  # ------------------------------------------------------------------
  update-state:
    needs: [check, build]
    if: ${{ always() && needs.check.outputs.should_build == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 写入已构建提交记录
        uses: actions/github-script@v8
        with:
          script: |
            const device = '${{ needs.check.outputs.device }}';
            const sha = '${{ needs.check.outputs.head_sha }}';
            const path = `.upstream-commit-${device}`;

            const content = Buffer.from(`${sha}\n`).toString('base64');
            let fileSha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: context.payload.repository.default_branch
              });
              fileSha = data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: context.payload.repository.default_branch,
              message: `chore: record built upstream commit ${sha.slice(0, 7)} for ${device}`,
              content,
              ...(fileSha ? { sha: fileSha } : {}),
            });
            core.info(`已记录 ${device} 的上游提交 ${sha.slice(0, 7)}`);


            core.info(`已记录上游提交 ${sha} 到 ${path}`);
